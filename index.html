<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1769aa, #eaf2f8);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        h1 {
            color: #1769aa;
            margin-bottom: 10px;
            font-size: 24px;
        }
        h2 {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .info-box {
            text-align: left;
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .info-box p {
            margin: 8px 0;
            font-size: 14px;
            color: #444;
        }
        .info-box span {
            font-weight: bold;
            color: #1769aa;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Profil Mahasiswa</h1>
        <h2>Nasywa Kayana</h2>
        
        <div class="info-box">
            <p><span>Program Studi:</span> Manajemen Informasi Komunikasi</p>
            <p><span>Mata Kuliah:</span> Cloud Computing</p>
            <p><span>Email:</span> mahasiswa@email.com</p>
        </div>
    </div>

</body>
</html>
