<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasywa Kayana - Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            font-size: 22px;
            color: #f8fafc;
            margin-bottom: 5px;
        }
        .role {
            font-size: 14px;
            color: #38bdf8;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .bio {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-link {
            display: block;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .btn-link:hover {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }
        footer {
            margin-top: 25px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nasywa Kayana</h1>
        <div class="role">Manajemen Informasi Komunikasi</div>
        
        <p class="bio">
            Mahasiswa aktif yang sedang bermain ROBLOX.
        </p>

        <div class="menu-list">
            <a href="mailto:mahasiswa@email.com" class="btn-link">Kirim Email</a>
            <a href="https://github.com/aeyoouuw" target="_blank" class="btn-link">GitHub Profile</a>
            <a href="#" onclick="alert('Mata Kuliah: Cloud Computing'); return false;" class="btn-link">Info Mata Kuliah</a>
        </div>

        <footer>
            &copy; 2026 Nasywa Kayana
        </footer>
    </div>

</body>
</html>
