<html lang="id">

    <title>Nasywa Kayana - Portfolio & Profile</title>

        body {
            background: #0f172a;

        .container {

            padding: 40px 30px;

            border: 1px solid #334155;

        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

            position: relative;

            height: 110px;
            margin: 0 auto 20px;
        }
